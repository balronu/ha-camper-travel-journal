name: Stable Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tested stable tag, for example v0.3.0"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Require stable tag
        run: test "${{ inputs.tag }}" = "v0.3.0"
      - name: Create GitHub stable release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ inputs.tag }}" --repo "${{ github.repository }}" --title "Camper Travel Journal ${{ inputs.tag }}" --notes-file docs/releases/RELEASE_NOTES_v0.3.0.md
