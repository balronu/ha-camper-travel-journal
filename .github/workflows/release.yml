name: Beta Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tested tag, for example v0.1.0-beta.14"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Require beta tag
        run: test "${{ inputs.tag }}" = "v0.1.0-beta.14"
      - name: Create GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ inputs.tag }}" --repo "${{ github.repository }}" --prerelease --title "Camper Travel Journal ${{ inputs.tag }}" --notes-file docs/releases/RELEASE_NOTES_v0.1.0-beta.14.md
