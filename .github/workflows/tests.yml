name: Tests

on:
  push:
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install pinned test dependencies
        run: python -m pip install --upgrade pip && python -m pip install "homeassistant==2026.10.1" "pytest==9.0.3" "pytest-asyncio==1.4.0" "pytest-cov==7.1.0" "pytest-homeassistant-custom-component==0.13.372" "reportlab==5.0.1"
      - name: Run tests and coverage
        run: pytest -q
      - name: Compile Python
        run: python -m compileall -q custom_components tests
      - name: Validate JSON
        run: python -c "import json, pathlib; [json.loads(p.read_text()) for p in pathlib.Path('.').rglob('*.json') if '.git' not in p.parts]"
      - name: Check patch whitespace
        run: git diff --check
      - name: Build and test frontend
        working-directory: frontend
        run: npm ci && npm run build && cd .. && git diff --exit-code -- custom_components/camper_travel_journal/frontend/camper-travel-journal.js && cd frontend && npm test
      - name: Run Chromium lifecycle regression
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/camper-travel-journal-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          chromium --headless --no-sandbox --disable-gpu --virtual-time-budget=1000 \
            --dump-dom http://127.0.0.1:8765/frontend/tests/browser/lifecycle.html >/tmp/camper-travel-journal-dom.html
          node - <<'NODE'
          const fs = require('fs');
          const html = fs.readFileSync('/tmp/camper-travel-journal-dom.html', 'utf8');
          const match = html.match(/<pre id="result">([\s\S]*?)<\/pre>/);
          if (!match) throw new Error('lifecycle harness returned no result');
          const result = JSON.parse(match[1]);
          if (result.vehicleCalls !== 2) throw new Error(`expected editor plus diagnostic vehicle queries, got ${result.vehicleCalls}`);
          if (result.dataCalls !== 3) throw new Error(`expected diagnostic plus overview and trip-specific data queries, got ${result.dataCalls}`);
          if (result.configEvents !== 1) throw new Error(`expected one config-changed event, got ${result.configEvents}`);
          if (result.selectedVehicle !== 'entry-wohnmobil') throw new Error(`unexpected selected vehicle: ${result.selectedVehicle}`);
          if (result.optionCount !== 2) throw new Error(`unexpected option count: ${result.optionCount}`);
          if (result.noTripMessage) throw new Error('trip preview unexpectedly rendered as empty');
          if (!result.summaryCost) throw new Error('trip-specific cost total did not render');
          if (!result.diagnosticStarted) throw new Error('diagnostic card did not render a start button');
          if (result.diagnosticCallsBefore !== 1) throw new Error(`diagnostic ran automatically: ${result.diagnosticCallsBefore}`);
          if (result.diagnosticCallsAfter !== 6) throw new Error(`expected diagnostic plus two summary calls, got ${result.diagnosticCallsAfter}`);
          if (!result.diagnosticReport) throw new Error('diagnostic report did not render');
          if (!result.catalog) throw new Error('journal and diagnostic cards were not both discoverable in the card catalog');
          if (result.visibleTemplateLeak) throw new Error('frontend template source leaked into visible DOM');
          console.log(JSON.stringify(result));
          NODE
      - name: Run Journal Card module editor regression
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/camper-travel-journal-modules-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          sleep 0.3
          chromium --headless --no-sandbox --disable-gpu --window-size=390,900 --virtual-time-budget=6000 \
            --dump-dom http://127.0.0.1:8765/frontend/tests/browser/journal-modules.html >/tmp/camper-travel-journal-modules-dom.html
          node - <<'NODE'
          const fs = require('fs');
          const html = fs.readFileSync('/tmp/camper-travel-journal-modules-dom.html', 'utf8');
          const match = html.match(/<pre id="result">([\s\S]*?)<\/pre>/);
          if (!match) throw new Error('module editor harness returned no result');
          const result = JSON.parse(match[1]);
          if (result.selectedVehicle !== 'camper') throw new Error(`unexpected selected vehicle: ${result.selectedVehicle}`);
          if (!result.tankbookActivatable || !result.tankbookEnabled) throw new Error(`tankbook was not activatable: ${JSON.stringify(result)}`);
          if (!result.restoredPosition || !result.disabledStillOrdered) throw new Error(`disabled module lost its saved position: ${JSON.stringify(result)}`);
          if (!result.movedFocus || result.movedPosition !== '3 von 8') throw new Error(`move feedback/focus failed: ${JSON.stringify(result)}`);
          if (!result.firstUpDisabled || !result.lastDownDisabled) throw new Error(`boundary controls are incorrect: ${JSON.stringify(result)}`);
          if (result.activeCount !== 7 || result.modules[0] !== 'overview') throw new Error(`unexpected module configuration: ${JSON.stringify(result)}`);
          if (!result.noProviderRequest || !result.noHorizontalOverflow) throw new Error(`module editor mobile regression failed: ${JSON.stringify(result)}`);
          console.log(JSON.stringify(result));
          NODE
      - name: Run Beta 8 tankbook and diagnostic regression
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/camper-travel-journal-tankbook-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          sleep 0.3
          chromium --headless --no-sandbox --disable-gpu --window-size=390,900 --virtual-time-budget=6000 \
            --dump-dom http://127.0.0.1:8765/frontend/tests/browser/tankbook-beta8.html >/tmp/camper-travel-journal-tankbook-dom.html
          node - <<'NODE'
          const fs = require('fs');
          const html = fs.readFileSync('/tmp/camper-travel-journal-tankbook-dom.html', 'utf8');
          const match = html.match(/<pre id="result">([\s\S]*?)<\/pre>/);
          if (!match) throw new Error('tankbook harness returned no result');
          const result = JSON.parse(match[1]);
          if (!result.german.note || !result.german.noRawCode || result.german.actions !== true || !result.german.touch || !result.german.noHorizontalOverflow) throw new Error(`German tankbook regression failed: ${JSON.stringify(result)}`);
          if (!result.english.note || !result.english.noRawCode) throw new Error(`English tankbook regression failed: ${JSON.stringify(result)}`);
          if (!result.consumption || !result.webasto || result.visibleTemplateLeak) throw new Error(`tankbook result regression failed: ${JSON.stringify(result)}`);
          console.log(JSON.stringify(result));
          NODE
      - name: Run expense category interaction regression
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/camper-travel-journal-expense-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          sleep 0.3
          chromium --headless --no-sandbox --disable-gpu --virtual-time-budget=1000 \
            --dump-dom http://127.0.0.1:8765/frontend/tests/browser/expense-category.html >/tmp/camper-travel-journal-expense-dom.html
          node - <<'NODE'
          const fs = require('fs');
          const html = fs.readFileSync('/tmp/camper-travel-journal-expense-dom.html', 'utf8');
          const match = html.match(/<pre id="result">([\s\S]*?)<\/pre>/);
          if (!match) throw new Error('expense harness returned no result');
          const result = JSON.parse(match[1]);
          if (result.initialSelectValue !== 'camping') throw new Error(`expected initial camping selection, got ${result.initialSelectValue}`);
          if (result.createdCategory !== 'camping') throw new Error(`expected camping payload, got ${result.createdCategory}`);
          if (!result.categoryLabel) throw new Error('camping label did not render');
          if (!result.total) throw new Error('camping expense total did not render');
          if (!result.summaryReflectsActiveTrip) throw new Error('summary card did not follow the shared active trip context');
          if (result.summaryListCalls < 2) throw new Error(`summary card did not perform its initial and synchronized trip loads: ${result.summaryListCalls}`);
          if (!result.closedAfterSave || !result.reopened || !result.switchedTrip || !result.closedSecond) throw new Error(`details toggle regression: ${JSON.stringify(result)}`);
          if (result.visibleTemplateLeak) throw new Error('frontend template source leaked into visible DOM');
          console.log(JSON.stringify(result));
          NODE
      - name: Run expense edit and localized date regression
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/camper-travel-journal-expense-edit-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          sleep 0.3
          chromium --headless --no-sandbox --disable-gpu --virtual-time-budget=5000 \
            --dump-dom http://127.0.0.1:8765/frontend/tests/browser/expense-edit-beta12.html >/tmp/camper-travel-journal-expense-edit-dom.html
          node - <<'NODE'
          const fs = require('fs');
          const html = fs.readFileSync('/tmp/camper-travel-journal-expense-edit-dom.html', 'utf8');
          const match = html.match(/<pre id="result">([\s\S]*?)<\/pre>/);
          if (!match) throw new Error('expense edit harness returned no result');
          const result = JSON.parse(match[1]);
          if (result.otherValue !== 'other') throw new Error(`expected Other selection, got ${result.otherValue}`);
          if (result.fuelValue !== 'fuel') throw new Error(`expected Fuel selection, got ${result.fuelValue}`);
          if (result.unchangedSaveCategory !== 'fuel' || result.unchangedSaveAmount !== 10504 || result.unchangedSaveDate !== '2026-10-13' || result.unchangedSaveTime !== '09:15') throw new Error(`unchanged save changed data: ${JSON.stringify(result)}`);
          if (!result.localizedDate) throw new Error(`localized expense date did not render: ${JSON.stringify(result)}`);
          if (!result.noTemplateLeak) throw new Error('frontend template source leaked into visible DOM');
          console.log(JSON.stringify(result));
          NODE
      - name: Run responsive journal metric regression
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/camper-travel-journal-responsive-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          sleep 0.3
          for width in 320 375 390 430 768 1280; do
            chromium --headless --no-sandbox --disable-gpu --window-size="${width},900" --virtual-time-budget=5000 \
              --dump-dom http://127.0.0.1:8765/frontend/tests/browser/journal-responsive-beta12.html >/tmp/camper-travel-journal-responsive-dom.html
            node - <<'NODE'
          const fs = require('fs');
          const html = fs.readFileSync('/tmp/camper-travel-journal-responsive-dom.html', 'utf8');
          const match = html.match(/<pre id="result">([\s\S]*?)<\/pre>/);
          if (!match) throw new Error('responsive harness returned no result');
          const result = JSON.parse(match[1]);
          if (result.metricCount !== 5 || !result.labelsInsideCards || !result.noHorizontalOverflow || !result.overnightVisible || result.visibleTemplateLeak) throw new Error(`responsive metrics failed: ${JSON.stringify(result)}`);
          console.log(JSON.stringify(result));
          NODE
          done
      - name: Run date formatting regression
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/camper-travel-journal-date-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          sleep 0.3
          chromium --headless --no-sandbox --disable-gpu --virtual-time-budget=1000 \
            --dump-dom http://127.0.0.1:8765/frontend/tests/browser/date-format.html >/tmp/camper-travel-journal-date-dom.html
          node - <<'NODE'
          const fs = require('fs');
          const html = fs.readFileSync('/tmp/camper-travel-journal-date-dom.html', 'utf8');
          const match = html.match(/<pre id="result">([\s\S]*?)<\/pre>/);
          if (!match) throw new Error('date harness returned no result');
          const result = JSON.parse(match[1]);
          if (!result.summaryPeriod || !result.managerPeriod) throw new Error(`German date period did not render: ${JSON.stringify(result)}`);
          if (result.visibleTemplateLeak) throw new Error('frontend template source leaked into visible DOM');
          console.log(JSON.stringify(result));
          NODE
      - name: Run GPX import target-selection regression
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/camper-travel-journal-gpx-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          sleep 0.3
          chromium --headless --no-sandbox --disable-gpu --virtual-time-budget=5000 \
            --dump-dom http://127.0.0.1:8765/frontend/tests/browser/gpx-import.html >/tmp/camper-travel-journal-gpx-dom.html
          node - <<'NODE'
          const fs = require('fs');
          const html = fs.readFileSync('/tmp/camper-travel-journal-gpx-dom.html', 'utf8');
          const match = html.match(/<pre id="result">([\s\S]*?)<\/pre>/);
          if (!match) throw new Error('GPX harness returned no result');
          const result = JSON.parse(match[1]);
          for (const [key, value] of Object.entries(result)) {
            if (key !== 'visibleTemplateLeak' && key !== 'importTripIds' && value !== true) throw new Error(`${key}=${value}`);
          }
          if (result.visibleTemplateLeak) throw new Error('frontend template source leaked into visible DOM');
          console.log(JSON.stringify(result));
          NODE
      - name: Run Summary trip-selection regression
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/camper-travel-journal-summary-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          sleep 0.3
          chromium --headless --no-sandbox --disable-gpu --virtual-time-budget=15000 \
            --dump-dom http://127.0.0.1:8765/frontend/tests/browser/summary-selection.html >/tmp/camper-travel-journal-summary-dom.html
          node - <<'NODE'
          const fs = require('fs');
          const html = fs.readFileSync('/tmp/camper-travel-journal-summary-dom.html', 'utf8');
          const match = html.match(/<pre id="result">([\s\S]*?)<\/pre>/);
          if (!match) throw new Error('summary harness returned no result');
          const result = JSON.parse(match[1]);
          for (const [key, value] of Object.entries(result)) {
            if (key !== 'visibleTemplateLeak' && value !== true) throw new Error(`${key}=${value}`);
          }
          if (result.visibleTemplateLeak) throw new Error('frontend template source leaked into visible DOM');
          console.log(JSON.stringify(result));
          NODE
      - name: Run map lifecycle regression
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/camper-travel-journal-map-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          sleep 0.3
          chromium --headless --no-sandbox --disable-gpu --virtual-time-budget=5000 \
            --dump-dom http://127.0.0.1:8765/frontend/tests/browser/map.html >/tmp/camper-travel-journal-map-dom.html
          node - <<'NODE'
          const fs = require('fs');
          const html = fs.readFileSync('/tmp/camper-travel-journal-map-dom.html', 'utf8');
          const match = html.match(/<pre id="result">([\s\S]*?)<\/pre>/);
          if (!match) throw new Error('map harness returned no result');
          const result = JSON.parse(match[1]);
          for (const [key, value] of Object.entries(result)) {
            if (key !== 'visibleTemplateLeak' && value !== true && key !== 'routeCalls') throw new Error(`${key}=${value}`);
          }
          if (result.routeCalls < 1) throw new Error('map did not request route data');
          if (result.visibleTemplateLeak) throw new Error('frontend template source leaked into visible DOM');
          console.log(JSON.stringify(result));
          NODE
      - name: Run map coordinate edge regression
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/camper-travel-journal-map-edge-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          sleep 0.3
          chromium --headless --no-sandbox --disable-gpu --virtual-time-budget=15000 \
            --dump-dom http://127.0.0.1:8765/frontend/tests/browser/map-edge.html >/tmp/camper-travel-journal-map-edge-dom.html
          node - <<'NODE'
          const fs = require('fs');
          const html = fs.readFileSync('/tmp/camper-travel-journal-map-edge-dom.html', 'utf8');
          const match = html.match(/<pre id="result">([\s\S]*?)<\/pre>/);
          if (!match) throw new Error('map edge harness returned no result');
          const result = JSON.parse(match[1]);
          const edge = result.results;
          if (!edge.empty.hasNoValidMessage || edge.empty.hasRoute) throw new Error(`empty case failed: ${JSON.stringify(edge.empty)}`);
          if (!edge.invalid.hasNoValidMessage || edge.invalid.hasRoute) throw new Error(`invalid route case failed: ${JSON.stringify(edge.invalid)}`);
          if (!edge.mixed.hasRoute || edge.mixed.hasNoValidMessage) throw new Error(`mixed route case failed: ${JSON.stringify(edge.mixed)}`);
          if (!edge.markerOnly.hasNoValidMessage || !edge.markerOnly.overlayPaths) throw new Error(`marker-only case failed: ${JSON.stringify(edge.markerOnly)}`);
          if (!edge.invalidMarkers.hasRoute) throw new Error(`invalid marker case failed: ${JSON.stringify(edge.invalidMarkers)}`);
          if (!edge.zero.hasRoute || edge.zero.hasNoValidMessage) throw new Error(`zero coordinate case failed: ${JSON.stringify(edge.zero)}`);
          if (result.visibleTemplateLeak) throw new Error('frontend template source leaked into visible DOM');
          console.log(JSON.stringify(result));
          NODE
      - name: Run central journal entry regression
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/camper-travel-journal-journal-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          sleep 0.3
          for width in 320 375 390 430 768 1280; do
            chromium --headless --no-sandbox --disable-gpu --window-size="${width},900" --virtual-time-budget=2000 \
              --dump-dom http://127.0.0.1:8765/frontend/tests/browser/journal-entry.html \
              >"/tmp/camper-travel-journal-journal-${width}-dom.html"
          done
          node - <<'NODE'
          const fs = require('fs');
          const widths = [320, 375, 390, 430, 768, 1280];
          const results = Object.fromEntries(widths.map((width) => {
            const html = fs.readFileSync(`/tmp/camper-travel-journal-journal-${width}-dom.html`, 'utf8');
            const match = html.match(/<pre id="result">([\s\S]*?)<\/pre>/);
            if (!match) throw new Error(`journal harness returned no result at ${width}px`);
            return [width, JSON.parse(match[1])];
          }));
          for (const [width, result] of Object.entries(results)) {
            if (!result.closed || !result.closedDetails.overflowFree || !result.closedDetails.touchTargets) throw new Error(`compact journal layout failed at ${width}px: ${JSON.stringify(result)}`);
            if (Number(width) === 320 && result.closedDetails.actions.some((label) => label.length > 18)) throw new Error(`narrow action labels are not usable at ${width}px`);
            if (result.visibleTemplateLeak) throw new Error(`frontend template source leaked into visible DOM at ${width}px`);
          }
          const result = results[390];
          if (!result.opened || !result.singleExpenseDisclosure || !result.closedAgain || !result.interruption?.saved || !result.interruption?.overnightCount || !result.interruption?.dialogClosedAfterRefresh) throw new Error(`central journal interruption/expense lifecycle failed: ${JSON.stringify(result)}`);
          console.log(JSON.stringify(results));
          NODE
      - name: Run central journal trip actions regression
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/camper-travel-journal-actions-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          sleep 0.3
          chromium --headless --no-sandbox --disable-gpu --window-size=1280,900 --virtual-time-budget=10000 \
            --dump-dom http://127.0.0.1:8765/frontend/tests/browser/journal-trip-actions.html >/tmp/camper-travel-journal-actions-dom.html
          chromium --headless --no-sandbox --disable-gpu --window-size=390,844 --virtual-time-budget=10000 \
            --dump-dom http://127.0.0.1:8765/frontend/tests/browser/journal-trip-actions.html >/tmp/camper-travel-journal-actions-mobile-dom.html
          node - <<'NODE'
          const fs = require('fs');
          function read(path) {
            const html = fs.readFileSync(path, 'utf8');
            const match = html.match(/<pre id="result">([\s\S]*?)<\/pre>/);
            if (!match) throw new Error(`actions harness returned no result: ${path}`);
            return JSON.parse(match[1]);
          }
          const desktop = read('/tmp/camper-travel-journal-actions-dom.html');
          const mobile = read('/tmp/camper-travel-journal-actions-mobile-dom.html');
          for (const [name, result] of Object.entries({ desktop, mobile })) {
            if (!result.initial?.pausedResume || !result.initial?.pausedComplete || !result.initial?.edit || !result.initial?.switchTrip || !result.initial?.delete || !result.initial?.normalGrid || !result.initial?.deleteSeparated) throw new Error(`${name} actions missing: ${JSON.stringify(result)}`);
            if (JSON.stringify(result.initial.order) !== JSON.stringify(['Reise fortsetzen', 'Abschließen', 'Bearbeiten', 'Reise wechseln'])) throw new Error(`${name} action order failed: ${JSON.stringify(result)}`);
            if (JSON.stringify(result.transitionStatuses) !== JSON.stringify(['completed', 'active', 'paused', 'active'])) throw new Error(`${name} status transitions failed: ${JSON.stringify(result)}`);
            for (const key of ['edited', 'switchNeutral', 'dialogExplainsData', 'cancelPreservedTrip', 'deleted']) if (!result[key]) throw new Error(`${name} ${key}=false: ${JSON.stringify(result)}`);
            if (result.visibleTemplateLeak || !result.layout.overflowFree) throw new Error(`${name} layout failed: ${JSON.stringify(result)}`);
          }
          if (mobile.viewport > 600 || !mobile.layout.columns || mobile.layout.columns.split(' ').length !== 2) throw new Error(`mobile layout is not responsive two-column: ${JSON.stringify(mobile)}`);
          if (!desktop.layout.columns || desktop.layout.columns.split(' ').length !== 2) throw new Error(`desktop layout is not two-column: ${JSON.stringify(desktop)}`);
          console.log(JSON.stringify({ desktop, mobile }));
          NODE
      - name: Run interruption stay manager regression
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/camper-travel-journal-stay-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          sleep 0.3
          chromium --headless --no-sandbox --disable-gpu --virtual-time-budget=5000 --dump-dom http://127.0.0.1:8765/frontend/tests/browser/stay-manager.html >/tmp/camper-travel-journal-stay-dom.html
          node - <<'NODE'
          const fs = require('fs');
          const html = fs.readFileSync('/tmp/camper-travel-journal-stay-dom.html', 'utf8');
          const match = html.match(/<pre id="result">([\s\S]*?)<\/pre>/);
          if (!match) throw new Error('stay harness returned no result');
          const result = JSON.parse(match[1]);
          for (const key of ['opened', 'savedThroughInterruptionApi', 'noRawCategoryCode', 'grouped']) if (!result[key]) throw new Error(`${key}=false`);
          console.log(JSON.stringify(result));
          NODE
      - name: Run ongoing stay presentation regression
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/camper-travel-journal-ongoing-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          sleep 0.3
          for width in 320 375 390 430; do
            chromium --headless --no-sandbox --disable-gpu --window-size="${width},900" --virtual-time-budget=5000 --dump-dom http://127.0.0.1:8765/frontend/tests/browser/ongoing-stay.html >/tmp/camper-travel-journal-ongoing-dom.html
            node - <<'NODE'
          const fs = require('fs');
          const html = fs.readFileSync('/tmp/camper-travel-journal-ongoing-dom.html', 'utf8');
          const match = html.match(/<pre id="result">([\s\S]*?)<\/pre>/);
          if (!match) throw new Error('ongoing stay harness returned no result');
          const result = JSON.parse(match[1]);
          for (const key of ['openStay', 'closedStayKeepsDateAndDuration', 'openSuggestionHasNoEqualEnd', 'closedSuggestionKeepsRange', 'noHorizontalOverflow']) if (!result[key]) throw new Error(`${key}=false: ${JSON.stringify(result)}`);
          if (result.visibleTemplateLeak) throw new Error('frontend template source leaked into visible DOM');
          console.log(JSON.stringify({ width: process.env.WIDTH, ...result }));
          NODE
          done
      - name: Run shared modal editor interaction regression
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/camper-travel-journal-modal-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          sleep 0.3
          chromium --headless --no-sandbox --disable-gpu --virtual-time-budget=25000 \
            --dump-dom http://127.0.0.1:8765/frontend/tests/browser/modal-editors.html >/tmp/camper-travel-journal-modal-dom.html
          node - <<'NODE'
          const fs = require('fs');
          const html = fs.readFileSync('/tmp/camper-travel-journal-modal-dom.html', 'utf8');
          const match = html.match(/<pre id="result">([\s\S]*?)<\/pre>/);
          if (!match) throw new Error('modal harness returned no result');
          const result = JSON.parse(match[1]);
          if (result.savedCount !== result.requiredKinds || result.savedCount !== 9) throw new Error(`expected all 9 modal kinds to save: ${JSON.stringify(result)}`);
