name: Tests

on:
  push:
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install pinned test dependencies
        run: python -m pip install --upgrade pip && python -m pip install "homeassistant==2026.10.1" "pytest==9.0.3" "pytest-asyncio==1.4.0" "pytest-cov==7.1.0" "pytest-homeassistant-custom-component==0.13.372"
      - name: Run tests and coverage
        run: pytest -q
      - name: Compile Python
        run: python -m compileall -q custom_components tests
      - name: Validate JSON
        run: python -c "import json, pathlib; [json.loads(p.read_text()) for p in pathlib.Path('.').rglob('*.json') if '.git' not in p.parts]"
      - name: Check patch whitespace
        run: git diff --check
      - name: Build and test frontend
        working-directory: frontend
        run: npm ci && npm run build && npm test
      - name: Run Chromium lifecycle regression
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/camper-travel-journal-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          chromium --headless --no-sandbox --disable-gpu --virtual-time-budget=1000 \
            --dump-dom http://127.0.0.1:8765/frontend/tests/browser/lifecycle.html >/tmp/camper-travel-journal-dom.html
          node - <<'NODE'
          const fs = require('fs');
          const html = fs.readFileSync('/tmp/camper-travel-journal-dom.html', 'utf8');
          const match = html.match(/<pre id="result">([\s\S]*?)<\/pre>/);
          if (!match) throw new Error('lifecycle harness returned no result');
          const result = JSON.parse(match[1]);
          if (result.vehicleCalls !== 2) throw new Error(`expected editor plus diagnostic vehicle queries, got ${result.vehicleCalls}`);
          if (result.dataCalls !== 3) throw new Error(`expected diagnostic plus overview and trip-specific data queries, got ${result.dataCalls}`);
          if (result.configEvents !== 1) throw new Error(`expected one config-changed event, got ${result.configEvents}`);
          if (result.selectedVehicle !== 'entry-wohnmobil') throw new Error(`unexpected selected vehicle: ${result.selectedVehicle}`);
          if (result.optionCount !== 2) throw new Error(`unexpected option count: ${result.optionCount}`);
          if (result.noTripMessage) throw new Error('trip preview unexpectedly rendered as empty');
          if (!result.summaryCost) throw new Error('trip-specific cost total did not render');
          if (!result.diagnosticStarted) throw new Error('diagnostic card did not render a start button');
          if (result.diagnosticCallsBefore !== 1) throw new Error(`diagnostic ran automatically: ${result.diagnosticCallsBefore}`);
          if (result.diagnosticCallsAfter !== 6) throw new Error(`expected diagnostic plus two summary calls, got ${result.diagnosticCallsAfter}`);
          if (!result.diagnosticReport) throw new Error('diagnostic report did not render');
          if (result.visibleTemplateLeak) throw new Error('frontend template source leaked into visible DOM');
          console.log(JSON.stringify(result));
          NODE
      - name: Run expense category interaction regression
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/camper-travel-journal-expense-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          sleep 0.3
          chromium --headless --no-sandbox --disable-gpu --virtual-time-budget=1000 \
            --dump-dom http://127.0.0.1:8765/frontend/tests/browser/expense-category.html >/tmp/camper-travel-journal-expense-dom.html
          node - <<'NODE'
          const fs = require('fs');
          const html = fs.readFileSync('/tmp/camper-travel-journal-expense-dom.html', 'utf8');
          const match = html.match(/<pre id="result">([\s\S]*?)<\/pre>/);
          if (!match) throw new Error('expense harness returned no result');
          const result = JSON.parse(match[1]);
          if (result.initialSelectValue !== 'camping') throw new Error(`expected initial camping selection, got ${result.initialSelectValue}`);
          if (result.createdCategory !== 'camping') throw new Error(`expected camping payload, got ${result.createdCategory}`);
          if (!result.categoryLabel) throw new Error('camping label did not render');
          if (!result.total) throw new Error('camping expense total did not render');
          if (!result.summaryTotal) throw new Error('summary card did not refresh after expense creation');
          if (result.summaryListCalls < 2) throw new Error(`summary card did not perform its initial and synchronized trip loads: ${result.summaryListCalls}`);
          if (!result.closedAfterSave || !result.reopened || !result.switchedTrip || !result.closedSecond) throw new Error(`details toggle regression: ${JSON.stringify(result)}`);
          if (result.visibleTemplateLeak) throw new Error('frontend template source leaked into visible DOM');
          console.log(JSON.stringify(result));
          NODE
