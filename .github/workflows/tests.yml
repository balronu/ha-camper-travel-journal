name: Tests

on:
  push:
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install pinned test dependencies
        run: python -m pip install --upgrade pip && python -m pip install "homeassistant==2026.10.1" "pytest>=8,<9" "pytest-asyncio>=1,<2" "pytest-cov>=6,<7" "pytest-homeassistant-custom-component==0.13.372"
      - name: Run tests and coverage
        run: pytest -q
      - name: Compile Python
        run: python -m compileall -q custom_components tests
      - name: Validate JSON
        run: python -c "import json, pathlib; [json.loads(p.read_text()) for p in pathlib.Path('.').rglob('*.json') if '.git' not in p.parts]"
      - name: Check patch whitespace
        run: git diff --check
