name: Tests

on:
  push:
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install pinned test dependencies
        run: python -m pip install --upgrade pip && python -m pip install "homeassistant==2026.10.1" "pytest==9.0.3" "pytest-asyncio==1.4.0" "pytest-cov==7.1.0" "pytest-homeassistant-custom-component==0.13.372"
      - name: Run tests and coverage
        run: pytest -q
      - name: Compile Python
        run: python -m compileall -q custom_components tests
      - name: Validate JSON
        run: python -c "import json, pathlib; [json.loads(p.read_text()) for p in pathlib.Path('.').rglob('*.json') if '.git' not in p.parts]"
      - name: Check patch whitespace
        run: git diff --check
      - name: Build and test frontend
        working-directory: frontend
        run: npm ci && npm run build && npm test
