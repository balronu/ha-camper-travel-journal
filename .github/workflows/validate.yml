name: Validate

on:
  push:
  pull_request:

jobs:
  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master

  hacs-structure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Validate custom integration structure
        run: |
          test -f custom_components/camper_travel_journal/manifest.json
          test -f custom_components/camper_travel_journal/config_flow.py
          test -f custom_components/camper_travel_journal/translations/en.json
          test -f custom_components/camper_travel_journal/translations/de.json
          test -f hacs.json
          python - <<'PY'
          import json
          from pathlib import Path
          manifest = json.loads(Path('custom_components/camper_travel_journal/manifest.json').read_text())
          hacs = json.loads(Path('hacs.json').read_text())
          assert manifest['domain'] == 'camper_travel_journal'
          assert manifest['version'] == '0.2.0-beta.2'
          assert manifest['config_flow'] is True
          assert hacs['homeassistant'] == '2026.10.1'
          PY
      - name: Validate frontend release contract
        run: |
          test -f frontend/package-lock.json
          test -f custom_components/camper_travel_journal/frontend/camper-travel-journal.js
          python - <<'PY'
          import json
          from pathlib import Path
          assert json.loads(Path('frontend/package.json').read_text())['version'] == '0.2.0-beta.2'
          assert '0.2.0-beta.2' in Path('custom_components/camper_travel_journal/const.py').read_text()
          PY

  secret-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
