<!doctype html>
<meta charset="utf-8">
<title>Camper Travel Journal map lifecycle test</title>
<div id="map-host"></div>
<pre id="result">starting</pre>
<script type="module">
const result = document.querySelector("#result");
let routeCalls = 0;
const trips = [{ id: "trip-1", title: "Synthetische Reise", description: "", destination: "Bremen", status: "active", started_at: "2026-10-13T12:00:00Z" }];
const drives = [{ id: "drive-1", started_at: "2026-10-13T08:00:00Z", ended_at: "2026-10-13T10:00:00Z", distance_m: 1200, trip_id: "trip-1", assignment_status: "assigned" }];
const connection = {
  async sendMessagePromise(message) {
    if (message.type === "camper_travel_journal/list_vehicles") return { vehicles: [{ vehicle_id: "entry-wohnmobil", name: "Wohnmobil", title: "Camper Travel Journal" }] };
    if (message.type === "camper_travel_journal/list") return { trips, drives, stops: [], expenses: [], expense_summary: { total_minor: 0, currency: "EUR", mixed_currency: false } };
    if (message.type === "camper_travel_journal/route") {
      routeCalls += 1;
      return { vehicle_id: "entry-wohnmobil", trip_id: "trip-1", segments: [{ drive_id: "drive-1", association_source: "gpx_exact", points: [{ id: 1, recorded_at: "2026-10-13T08:00:00Z", latitude: 53.1, longitude: 8.8 }, { id: 2, recorded_at: "2026-10-13T08:30:00Z", latitude: "not-a-number", longitude: 8.85 }, { id: 3, recorded_at: "2026-10-13T08:45:00Z", latitude: 91, longitude: 8.87 }, { id: 4, recorded_at: "2026-10-13T09:00:00Z", latitude: 53.2, longitude: 8.9 }], gaps: [{ from: "2026-10-13T08:00:00Z", to: "2026-10-13T09:00:00Z", seconds: 3600 }], total_points: 4, returned_points: 4, simplified: false }], total_points: 4, returned_points: 4, bounds: { min_latitude: 53.1, min_longitude: 8.8, max_latitude: 53.2, max_longitude: 8.9 }, gaps: [{ drive_id: "drive-1", from: "2026-10-13T08:00:00Z", to: "2026-10-13T09:00:00Z", seconds: 3600 }], simplified: false, truncated: false, association_semantics: "explicit_only" };
    }
    throw new Error(`unexpected command ${message.type}`);
  },
};
const hass = { connection, locale: { language: "en-US" } };
await import("/custom_components/camper_travel_journal/frontend/camper-travel-journal.js");
await customElements.whenDefined("camper-travel-journal-map-card");
const card = document.createElement("camper-travel-journal-map-card");
card.setConfig({ vehicle_id: "entry-wohnmobil", tile_url: "/missing-tiles/{z}/{x}/{y}.png", tile_attribution: "Synthetic provider" });
document.querySelector("#map-host").append(card);
card.hass = hass;
for (let attempt = 0; attempt < 120; attempt += 1) {
  if (routeCalls && card.shadowRoot?.querySelector(".leaflet-container")) break;
  await new Promise((resolve) => setTimeout(resolve, 25));
}
for (let attempt = 0; attempt < 80; attempt += 1) {
  if ((card.shadowRoot?.textContent ?? "").includes("background map could not be loaded")) break;
  await new Promise((resolve) => setTimeout(resolve, 25));
}
const text = card.shadowRoot?.textContent ?? "";
const details = card.shadowRoot?.querySelector("details");
if (details) { details.open = true; details.dispatchEvent(new Event("toggle")); }
const detailsOpened = Boolean(details?.open);
const selectNone = [...(card.shadowRoot?.querySelectorAll("button") ?? [])].find((button) => /^(Select none|Alle abwählen)$/.test(button.textContent?.trim() ?? ""));
selectNone?.click();
await new Promise((resolve) => setTimeout(resolve, 50));
const driveInputs = () => [...(card.shadowRoot?.querySelectorAll("input[type=checkbox]") ?? [])].filter((input) => !input.closest(".place-filter"));
const noneSelected = driveInputs().every((input) => !(input instanceof HTMLInputElement) || !input.checked);
card.shadowRoot?.querySelector("button")?.click();
await new Promise((resolve) => setTimeout(resolve, 50));
const allSelected = driveInputs().every((input) => !(input instanceof HTMLInputElement) || input.checked);
result.textContent = JSON.stringify({
  routeCalls,
  hasLeafletMap: Boolean(card.shadowRoot?.querySelector(".leaflet-container")),
  englishTitle: text.includes("Travel map"),
  englishSegments: text.includes("Drive sections"),
  tileErrorMessage: text.includes("background map could not be loaded"),
  configuredAttribution: text.includes("Synthetic provider"),
  routeImageLabel: card.shadowRoot?.querySelector(".map")?.getAttribute("aria-label") === "GPS route map",
  hasRouteLayer: Boolean(card.shadowRoot?.querySelector(".leaflet-overlay-pane path")),
  detailsOpened,
  noneSelected,
  allSelected,
  visibleTemplateLeak: /lit\$\d|=>\s*this\.|currentTarget\.value/.test(text),
}, null, 2);
card.remove();
</script>
