<!doctype html>
<meta charset="utf-8">
<title>Camper Travel Journal Beta 8 tankbook regression</title>
<div id="host"></div><pre id="result">starting</pre>
<script type="module">
const result = document.querySelector("#result");
window.addEventListener("error", (event) => { result.textContent = JSON.stringify({ harnessError: event.error?.stack || event.message }); });
window.addEventListener("unhandledrejection", (event) => { result.textContent = JSON.stringify({ harnessError: String(event.reason?.stack || event.reason) }); });
const trip = { id: "interval", title: "GPS-Verbrauchstest", destination: "Heidelberg", status: "completed", started_at: "2026-10-23T09:26:00Z", ended_at: "2026-10-26T11:04:00Z", start_date: "2026-10-23", end_date: "2026-10-26" };
const tankbook = { events: [
  { id: "tank-1", fuel_type: "diesel", liters: 42.42, price_per_liter: 2.169, amount_minor: 9201, occurred_at: "2026-10-26T11:04:00Z", fill_level: "full", odometer_km: null, expense_id: "expense-1", note: "Volltankung nach der Fahrt" },
  { id: "tank-2", fuel_type: "adblue", liters: 5, price_per_liter: 1.2, amount_minor: 600, occurred_at: "2026-10-25T10:00:00Z", fill_level: "partial", odometer_km: null, expense_id: null, note: "AdBlue" },
], consumption: { intervals: { diesel: [{ fuel_type: "diesel", started_at: "2026-10-23T09:26:00Z", ended_at: "2026-10-26T11:04:00Z", liters: 42.42, distance_km: 380, distance_source: "gps_drives", quality: "estimated", combined_l_per_100km: 11.163, heater_quality: "unknown", note: "gps_distance_is_estimated", gps_diagnosis: { found_drives: 1, considered_drives: 1, excluded_drives: [], gaps: [] } }], adblue: [], other: [] }, heating_disclaimer: "unknown" } };
const snapshot = { trips: [trip], drives: [{ id: "drive-1", started_at: "2026-10-23T10:00:00Z", ended_at: "2026-10-25T12:00:00Z", distance_m: 380000, duration_seconds: 172800, trip_id: "interval", source: "gps", assignment_status: "assigned" }], stops: [], interruptions: [], expenses: [{ id: "expense-1", occurred_at: "2026-10-26T11:04:00Z", occurred_on: "2026-10-26", occurred_time: "11:04", category: "fuel", amount_minor: 9201, fuel_liters: 42.42, fuel_price_per_liter: 2.169, note: "Volltankung nach der Fahrt", tank_event_id: "tank-1" }], expense_summary: { total_minor: 9201, currency: "EUR", mixed_currency: false } };
const connection = { async sendMessagePromise(message) {
  if (message.type === "camper_travel_journal/list_vehicles") return { vehicles: [{ vehicle_id: "camper", name: "Wohnmobil" }] };
  if (message.type === "camper_travel_journal/list") return message.trip_id ? snapshot : { ...snapshot, drives: [], expenses: [] };
  if (message.type === "camper_travel_journal/list_tankbook") return tankbook;
  throw new Error(`unexpected ${message.type}`);
} };
const hass = { connection, locale: { language: "de-DE" } };
await import("/custom_components/camper_travel_journal/frontend/camper-travel-journal.js");
await customElements.whenDefined("camper-travel-journal-journal-card");
const card = document.createElement("camper-travel-journal-journal-card");
card.setConfig({ vehicle_id: "camper", modules: ["overview", "tankbook"], module_order: ["overview", "tankbook"] });
card.hass = hass; document.querySelector("#host").append(card);
const waitFor = async (predicate) => { for (let i = 0; i < 200; i += 1) { if (predicate()) return; await new Promise((resolve) => setTimeout(resolve, 25)); } throw new Error(`tankbook harness timed out: ${card.shadowRoot?.innerHTML ?? "none"}`); };
await waitFor(() => card.shadowRoot?.querySelector("select"));
const select = card.shadowRoot.querySelector("select"); select.value = "interval"; select.dispatchEvent(new Event("change", { bubbles: true }));
await waitFor(() => !card.shadowRoot.querySelector("button")?.disabled); card.shadowRoot.querySelector("button")?.click();
await waitFor(() => card.shadowRoot?.querySelector(".tankbook"));
const intervalText = card.shadowRoot.textContent;
const linked = card.shadowRoot.querySelector(".tankbook-event");
const actionNames = [...(linked?.querySelectorAll("[data-action]") ?? [])].map((button) => button.getAttribute("data-action"));
const actionsTouchSized = [...(linked?.querySelectorAll("button") ?? [])].every((button) => getComputedStyle(button).minHeight === "44px" || button.getBoundingClientRect().height >= 44);
const german = { note: intervalText.includes("Hinweis: Fahrstrecke anhand von GPS-Daten geschätzt"), noRawCode: !intervalText.includes("gps_distance_is_estimated"), actions: actionNames.join(",") === "edit,unlink,delete", touch: actionsTouchSized, noHorizontalOverflow: document.documentElement.scrollWidth <= document.documentElement.clientWidth && card.getBoundingClientRect().width <= document.documentElement.clientWidth };
hass.locale.language = "en-US"; card.hass = hass; card.requestUpdate(); await new Promise((resolve) => setTimeout(resolve, 80));
const englishText = card.shadowRoot.textContent;
const english = { note: englishText.includes("Note: Distance estimated from GPS data"), noRawCode: !englishText.includes("gps_distance_is_estimated") };
result.textContent = JSON.stringify({ german, english, consumption: intervalText.includes("11.16 l/100 km"), webasto: intervalText.includes("Heizungsverbrauch unbekannt"), linkedActions: actionNames, visibleTemplateLeak: /lit\$\d|=>\s*this\./.test(intervalText) }, null, 2);
</script>
