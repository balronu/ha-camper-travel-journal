<!doctype html>
<meta charset="utf-8">
<title>Camper Travel Journal write versus refresh regression</title>
<div id="host"></div><pre id="result">starting</pre>
<script type="module">
const result = document.querySelector("#result");
window.addEventListener("error", (event) => { result.textContent = JSON.stringify({ harnessError: event.error?.stack || event.message }); });
window.addEventListener("unhandledrejection", (event) => { result.textContent = JSON.stringify({ harnessError: String(event.reason?.stack || event.reason) }); });
const writes = [];
let failWrite = false;
let refreshFail = false;
let writePending = false;
const trips = [{ id:"trip-1", title:"Synthetische Reise", destination:"Bremen", status:"active", started_at:"2026-10-13T12:00:00Z", start_date:"2026-10-13", end_date:"2026-10-14" }];
const snapshot = { trips, drives:[], stops:[], available_drives:[], interruptions:[], expenses:[], expense_summary:{ total_minor:0, currency:"EUR", mixed_currency:false } };
const connection = { async sendMessagePromise(message) {
  if (message.type === "auth/current_user") return { authenticated:true };
  if (message.type === "camper_travel_journal/list_vehicles") return { vehicles:[{ vehicle_id:"camper", name:"Synthetic Camper" }] };
  if (message.type === "camper_travel_journal/list") { if (refreshFail) throw new Error("refresh failed"); return snapshot; }
  if (message.type === "camper_travel_journal/create_trip") {
    writes.push(message);
    if (failWrite) throw new Error("write failed");
    if (writePending) await new Promise((resolve) => setTimeout(resolve, 150));
    return { trip_id:"trip-created" };
  }
  return {};
} };
const hass = { connection, locale:{ language:"de-DE" } };
await import("/custom_components/camper_travel_journal/frontend/camper-travel-journal.js");
await customElements.whenDefined("camper-travel-journal-manager-card");
const host = document.querySelector("#host");
const manager = document.createElement("camper-travel-journal-manager-card");
manager.setConfig({ vehicle_id:"camper" }); manager.hass = hass; host.append(manager);
const wait = async (predicate) => { for (let i=0; i<300; i++) { if (predicate()) return; await new Promise((resolve) => setTimeout(resolve, 20)); } throw new Error("write-refresh harness timeout"); };
const dialog = () => manager.shadowRoot.querySelector("dialog.editor-dialog");
const fillTitle = (title) => { const input = dialog().querySelector('input[required]'); input.value = title; input.dispatchEvent(new Event("input", { bubbles:true })); return input; };
const submit = () => dialog().querySelector('button[type="submit"]').click();
await wait(() => manager.shadowRoot?.querySelector(".manager-shell"));

manager.startTripCreate(); await wait(() => dialog()?.open);
const failedInput = fillTitle("Retry nach echtem Fehler");
failWrite = true; submit(); await wait(() => dialog()?.querySelector('[role="alert"]'));
const retainedOnWriteError = dialog().open && failedInput.value === "Retry nach echtem Fehler";
const writesAfterFailure = writes.length;
failWrite = false; submit(); await wait(() => !dialog()?.open);
const retryWasSingleWrite = writes.length === writesAfterFailure + 1;

manager.startTripCreate(); await wait(() => dialog()?.open); fillTitle("Gespeichert trotz Refreshfehler");
const beforeRefreshFailure = writes.length; refreshFail = true; submit();
await wait(() => manager.shadowRoot.textContent.includes("Gespeichert") && !dialog()?.open);
const savedDespiteRefreshFailure = writes.length === beforeRefreshFailure + 1;
refreshFail = false; await manager.refresh(); await wait(() => !manager.shadowRoot.textContent.includes("Gespeichert. Die Ansicht"));
const noSecondWriteAfterRefreshFailure = writes.length === beforeRefreshFailure + 1;

manager.startTripCreate(); await wait(() => dialog()?.open); fillTitle("Doppelklick");
const beforeDoubleClick = writes.length; writePending = true; submit(); submit();
await wait(() => !dialog()?.open); writePending = false;
const doubleClickSingleWrite = writes.length === beforeDoubleClick + 1;

manager.startTripCreate(); await wait(() => dialog()?.open); fillTitle("Reisewechsel während Write");
const beforeSwitch = writes.length; writePending = true; submit();
window.dispatchEvent(new CustomEvent("camper-travel-journal-active-trip-changed", { detail:{ vehicleId:"camper", tripId:"trip-2", source:"write-refresh-test" } }));
await wait(() => !dialog()?.open); writePending = false;
const tripSwitchSingleWrite = writes.length === beforeSwitch + 1;

result.textContent = JSON.stringify({ retainedOnWriteError, retryWasSingleWrite, savedDespiteRefreshFailure, noSecondWriteAfterRefreshFailure, doubleClickSingleWrite, tripSwitchSingleWrite, writeCalls:writes.length }, null, 2);
</script>
